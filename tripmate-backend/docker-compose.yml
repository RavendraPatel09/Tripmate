services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tripmate
      POSTGRES_PASSWORD: tripmate
      POSTGRES_DB: tripmate
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tripmate']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://tripmate:tripmate@postgres:5432/tripmate
      REDIS_URL: redis://redis:6379
    ports:
      - '4000:4000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Apply pending migrations, then start the server. `migrate deploy` (not
    # `migrate dev`) is the safe, non-interactive command for this — it never
    # prompts and never resets data.
    command: sh -c "npx prisma migrate deploy && node dist/server.js"

volumes:
  postgres-data:
